# .github/workflows/ci.yml
# CI = "Continuous Integration". Every time someone pushes code or opens a
# pull request, GitHub runs this checklist on a fresh computer in the cloud.
# If any step fails, we get a red ❌ and know something needs fixing BEFORE
# it reaches real users. It's like a robot teacher marking homework.
#
#   push / pull request
#          |
#          v
#   install -> lint -> unit + integration + security tests -> npm audit
#          |
#          +--> end-to-end tests (real browser)
#          +--> build the Docker image and check it starts
#          +--> (deploy: switched off, see the bottom of this file)

name: CI

on:
  push:
    branches: [main]
  pull_request:

# SAFETY: this workflow may only READ the code, not change it.
permissions:
  contents: read

jobs:
  test:
    name: Lint, tests and audit
    runs-on: ubuntu-latest
    steps:
      - name: Download the code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install libraries (exact versions from package-lock.json)
        run: npm ci

      - name: Lint (spell-check the code)
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Security tests
        run: npm run test:security

      - name: Check every lesson links to real files
        run: npm run check:links

      - name: Check libraries for known security holes
        run: npm audit --audit-level=high

  e2e:
    name: End-to-end tests (real browser)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Install the Chromium browser for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Keep the report if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Build the Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build --tag kids-todo-app:${{ github.sha }} .

      - name: Start it and check /health says ok
        run: |
          docker run --detach --name smoke-test --publish 3000:3000 kids-todo-app:${{ github.sha }}
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://localhost:3000/health; then
              echo " <- the app is healthy!"
              exit 0
            fi
            sleep 1
          done
          echo "The app never became healthy. Here are its logs:"
          docker logs smoke-test
          exit 1

  # ----------------------------------------------------------------------
  # DEPLOY (switched off on purpose)
  #
  # "Deploying" means putting the new version on a real server in the cloud
  # so real people can use it. In a real project, this job would run only
  # when all the checks above are green AND the code is on main.
  #
  # What would happen, step by step:
  #   1. Log in to a "container registry" (a library for Docker images,
  #      e.g. GitHub Container Registry, Amazon ECR or Google Artifact Registry).
  #   2. Push the image we just built, labelled with this commit's id.
  #   3. Tell the cloud service (e.g. AWS ECS, Google Cloud Run, Fly.io,
  #      Render) to start containers from the new image.
  #   4. The service waits for GET /health to say "ok" on the new version
  #      before sending visitors to it (a "rolling deploy"). If it never
  #      becomes healthy, the old version keeps running. No outage!
  #   5. Secrets like SESSION_SECRET come from the cloud's secret store,
  #      never from this file. HTTPS is handled by the cloud's load
  #      balancer, so COOKIE_SECURE=true and TRUST_PROXY=true there.
  #
  # deploy:
  #   name: Deploy to the cloud
  #   runs-on: ubuntu-latest
  #   needs: [test, e2e, docker]
  #   if: github.ref == 'refs/heads/main' && github.event_name == 'push'
  #   environment: production          # can require a human to click "approve"
  #   permissions:
  #     contents: read
  #     packages: write                # allowed to upload the image
  #   steps:
  #     - uses: actions/checkout@v4
