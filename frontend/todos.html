<!doctype html>
<!--
  todos.html is the page where your list lives.
  The list starts EMPTY in this file. app.js asks the server for your
  todos and then builds the list items on the page.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My todos · Kids Todo App</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body data-page="todos">
  <div id="server-message" class="banner" role="alert" hidden></div>

  <main class="card">
    <header class="top-bar">
      <div>
        <h1>My todos</h1>
        <p id="greeting" class="greeting"></p>
      </div>
      <button id="logout-button" class="secondary small" type="button">Log out</button>
    </header>

    <form id="add-todo-form" class="add-form">
      <label for="todo-text" class="visually-hidden">What do you want to do?</label>
      <input id="todo-text" name="text" placeholder="What do you want to do?" maxlength="200" required>
      <button type="submit">Add</button>
    </form>

    <p id="form-message" class="message" role="status"></p>

    <nav class="filters" aria-label="Show which todos">
      <button type="button" class="filter is-active" data-filter="all">All</button>
      <button type="button" class="filter" data-filter="false">To do</button>
      <button type="button" class="filter" data-filter="true">Done</button>
    </nav>

    <ul id="todo-list" class="todo-list"></ul>
    <p id="empty-message" class="empty" hidden>Nothing here yet. Add your first todo above! 🌱</p>
  </main>
</body>
</html>
