<!doctype html>
<!--
  login.html has TWO forms:
    - "Log in" for people who already have an account
    - "Sign up" for people who are new
  A <form> collects what you type and app.js sends it to the server.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · Kids Todo App</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body data-page="login">
  <div id="server-message" class="banner" role="alert" hidden></div>

  <main class="card">
    <p><a href="/">← Home</a></p>
    <h1>Welcome!</h1>

    <p id="form-message" class="message" role="status"></p>

    <section>
      <h2>Log in</h2>
      <form id="login-form">
        <label for="login-username">Username</label>
        <input id="login-username" name="username" autocomplete="username" required>

        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit">Log in</button>
      </form>
    </section>

    <section>
      <h2>New here? Sign up</h2>
      <form id="signup-form">
        <label for="signup-username">Pick a username</label>
        <input id="signup-username" name="username" autocomplete="username" required minlength="3" maxlength="30">

        <label for="signup-password">Pick a password (at least 8 characters)</label>
        <input id="signup-password" name="password" type="password" autocomplete="new-password" required minlength="8">

        <button type="submit">Sign up</button>
      </form>
    </section>
  </main>
</body>
</html>
