<!doctype html>
<!--
  index.html is the "front door" of our website.
  When you visit http://localhost:3000/ the server sends you this file.
  HTML describes WHAT is on the page: headings, paragraphs, buttons and links.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kids Todo App</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body data-page="home">
  <div id="server-message" class="banner" role="alert" hidden></div>

  <main class="card">
    <h1>📝 Kids Todo App</h1>
    <p class="lead">Write down the things you want to do, then tick them off when you are done!</p>

    <ul class="steps">
      <li>1. Make an account</li>
      <li>2. Add your todos</li>
      <li>3. Tick them off ✅</li>
    </ul>

    <p class="actions">
      <a class="button" href="/login.html">Log in or sign up</a>
      <a class="button secondary" href="/todos.html">Go to my todos</a>
    </p>

    <p><a href="/course/">📚 Learn how websites work: try the interactive lessons</a></p>
  </main>
</body>
</html>
